services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://finance:finance@postgres:5432/finance?schema=public
      AUTH_SECRET: change-me-before-production
      AUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
volumes:
  postgres_data:
