name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - run: npx prisma migrate deploy

      - name: Testes de integração
        run: npm run test:integration

      - name: Build da API (Next.js)
        run: npm run build

      - name: Build dos workers (wa-gateway, jobs)
        run: npm run build:workers
