version: 1
context_root: Context
default_language: en
progressive_loading:
  l0:
    - Context/MAP.md
    - Context/STATE.md
  l1: Context/branches/<branch>/_index.md
  l2: atomic-records
  l3: sources-and-evidence
write_policy:
  mode: controlled
  save_triggers:
    - salvar contexto
    - salve o contexto
    - save context
    - persistir contexto
    - atualizar contexto
    - atualizar memoria do projeto
    - criar checkpoint
    - checkpoint da sessao
security:
  forbid_secret_values: true
